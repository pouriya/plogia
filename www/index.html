<!doctype html>
<!--
  Served for /, /index.html and /p/<n>. The server replaces each {{name}} with
  HTML-escaped text: channel_title, channel_description, channel_avatar, and,
  per page, title, description, type, published, url (link previews; no
  image on purpose) and post (the post number to open at, empty for the
  newest).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="{{type}}">
<meta property="og:locale" content="fa_IR">
<meta property="og:site_name" content="{{channel_title}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="article:published_time" content="{{published}}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17212b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wallpaper" aria-hidden="true"></div>

<header class="top">
  <button class="channel" id="channel" type="button" aria-label="Channel info">
    <img class="avatar" src="{{channel_avatar}}" alt="">
    <span class="channel-text">
      <span class="channel-title" dir="auto">{{channel_title}}</span>
      <span class="channel-sub" id="subscribers">&nbsp;</span>
    </span>
  </button>
</header>

<main id="feed" data-post="{{post}}" data-channel="{{channel_title}}" data-avatar="{{channel_avatar}}">
  <div class="sentinel" id="older"></div>
  <div id="posts"></div>
  <div class="sentinel" id="newer"></div>
</main>

<button class="down" id="down" type="button" aria-label="Go to the newest post" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
</button>

<aside class="info" id="info" hidden aria-label="Channel info">
  <div class="info-bar">
    <button class="icon-button" id="info-close" type="button" aria-label="Close">
      <svg class="x" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      <svg class="back" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/></svg>
    </button>
    <span>Channel Info</span>
  </div>
  <div class="info-head">
    <img class="avatar" src="{{channel_avatar}}" alt="">
    <h1 dir="auto">{{channel_title}}</h1>
    <p id="info-subscribers">&nbsp;</p>
    <button class="info-share" id="info-share" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5v4C7 10 4 15 3 20c2.5-3.5 6-5.1 11-5.1V19l7-7-7-7z"/></svg>
      Share
    </button>
  </div>
  <div class="info-rows">
    <div class="info-row">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
      <div><p dir="auto">{{channel_description}}</p><span>Info</span></div>
    </div>
    <button class="info-row" id="info-link" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.9 12A3.1 3.1 0 0 1 7 8.9h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z"/></svg>
      <div><p id="info-host"></p><span>Link</span></div>
    </button>
    <div class="info-row">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>
      <div><p id="info-posts">&nbsp;</p></div>
    </div>
  </div>
</aside>

<div class="menu" id="menu" role="menu" hidden>
  <button type="button" role="menuitem" data-action="text">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
    Copy Text
  </button>
  <button type="button" role="menuitem" data-action="link">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.9 12A3.1 3.1 0 0 1 7 8.9h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z"/></svg>
    Copy Link
  </button>
  <button type="button" role="menuitem" data-action="forward">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5v4C7 10 4 15 3 20c2.5-3.5 6-5.1 11-5.1V19l7-7-7-7z"/></svg>
    Forward
  </button>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<div class="lightbox" id="lightbox" hidden><img alt=""></div>

<noscript><p class="pill">This channel needs JavaScript to show its posts.</p></noscript>
<script src="/app.js" defer></script>
</body>
</html>
