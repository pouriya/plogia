<!doctype html>
<!--
  Served for /, /index.html and /p/<n>. The server replaces each {{name}} with
  HTML-escaped text: channel_title, channel_description, channel_avatar,
  telegram and github (the channel's links), and,
  per page, title, description, type, published, url, locale (link previews;
  no image on purpose), language (fa or en, from ?l=, Persian without it) and
  post (the post number to open at, empty for the newest).
-->
<html lang="{{language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="{{type}}">
<meta property="og:locale" content="{{locale}}">
<meta property="og:site_name" content="{{channel_title}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="article:published_time" content="{{published}}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17212b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="alternate" type="application/rss+xml" title="{{channel_title}}" href="/rss.xml?l={{language}}" id="rss-link">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wallpaper" aria-hidden="true"></div>

<header class="top">
  <div class="top-bar">
    <button class="channel" id="channel" type="button" aria-label="Channel Info" data-label="channelInfo">
      <img class="avatar" src="{{channel_avatar}}" alt="">
      <span class="channel-text">
        <span class="channel-title" dir="auto">{{channel_title}}</span>
        <span class="channel-sub subscriber-count">&nbsp;</span>
      </span>
    </button>
    <button class="top-language" id="top-language" type="button" lang="fa" data-text="otherLanguage">فارسی</button>
  </div>
</header>

<main id="feed" data-post="{{post}}" data-channel="{{channel_title}}" data-avatar="{{channel_avatar}}">
  <div class="sentinel" id="older"></div>
  <div id="posts"></div>
  <div class="sentinel" id="newer"></div>
</main>

<button class="down" id="down" type="button" aria-label="Go to the newest post" data-label="newest" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
</button>

<button class="join" id="join" type="button" hidden><span data-text="join">Join Channel</span></button>

<aside class="info" id="info" hidden aria-label="Channel Info" data-label="channelInfo">
  <div class="info-bar">
    <button class="icon-button panel-close" id="info-close" type="button" aria-label="Close" data-label="close">
      <svg class="x" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      <svg class="back" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/></svg>
    </button>
    <span data-text="channelInfo">Channel Info</span>
  </div>
  <div class="info-head">
    <button class="info-photo" id="info-photo" type="button" aria-label="Open the photo" data-label="openPhoto">
      <img class="avatar" src="{{channel_avatar}}" alt="">
    </button>
    <h1 dir="auto">{{channel_title}}</h1>
    <p class="subscriber-count">&nbsp;</p>
    <button class="info-share" id="info-share" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5v4C7 10 4 15 3 20c2.5-3.5 6-5.1 11-5.1V19l7-7-7-7z"/></svg>
      <span data-text="share">Share</span>
    </button>
  </div>
  <div class="info-rows">
    <div class="info-row">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
      <div><p dir="auto">{{channel_description}}</p><span data-text="info">Info</span></div>
    </div>
    <div class="info-row">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>
      <div><p id="info-posts">&nbsp;</p></div>
    </div>
  </div>
  <div class="cards">
    <button class="card site" id="info-link" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.9 12A3.1 3.1 0 0 1 7 8.9h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z"/></svg>
      <span data-text="website">Website</span>
    </button>
    <a class="card telegram" href="{{telegram}}" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.8 15.2 9.4 20c.6 0 .8-.3 1.1-.6l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9l3.5-16.6c.3-1.5-.6-2.1-1.6-1.7L1.8 9.9c-1.4.6-1.4 1.4-.2 1.8l5.3 1.6 12.3-7.7c.6-.4 1.1-.2.7.2z"/></svg>
      <span data-text="telegram">Telegram</span>
    </a>
    <button class="card rss" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.2 15.6a2.2 2.2 0 1 1 0 4.4 2.2 2.2 0 0 1 0-4.4zM4 4.4v2.9c7 0 12.7 5.7 12.7 12.7h2.9C19.6 11.4 12.6 4.4 4 4.4zm0 5.7v2.8c3.9 0 7.1 3.2 7.1 7.1h2.8c0-5.5-4.4-9.9-9.9-9.9z"/></svg>
      <span data-text="rss">RSS</span>
    </button>
    <a class="card github" href="{{github}}" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2 0 1.9 1.2 1.9 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8 0 3.2.9.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1 .9 2.2v3.3c0 .3.1.7.8.6A12 12 0 0 0 12 .3"/></svg>
      <span data-text="github">GitHub</span>
    </a>
  </div>
  <div class="info-rows">
    <button class="info-row" id="info-language" type="button" role="switch" aria-checked="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6H16a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.4 1.1-2.8 1.9-4zM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3zm.8 2h3a15.7 15.7 0 0 0 1.3 3.6A8 8 0 0 1 5.1 16zM8 8H5.1a8 8 0 0 1 4.3-3.6C8.8 5.5 8.4 6.7 8 8zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.4-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h2.9a8 8 0 0 1-4.3 3.6zm1.8-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4h-3.4z"/></svg>
      <div><p lang="fa">فارسی</p><span data-text="language">Language</span></div>
      <span class="switch" aria-hidden="true"></span>
    </button>
  </div>
</aside>

<aside class="info" id="join-panel" hidden aria-label="Join" data-label="joinTitle">
  <div class="info-bar">
    <button class="icon-button panel-close" id="join-close" type="button" aria-label="Close" data-label="close">
      <svg class="x" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      <svg class="back" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/></svg>
    </button>
    <span data-text="joinTitle">Join</span>
  </div>
  <div class="info-head">
    <img class="avatar" src="{{channel_avatar}}" alt="">
    <h1 dir="auto">{{channel_title}}</h1>
    <p class="subscriber-count">&nbsp;</p>
  </div>
  <form class="join-form" id="join-form" novalidate>
    <p class="join-lead">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
      <span data-text="emailLead">Get new posts by email</span>
    </p>
    <input id="join-email" type="email" dir="ltr" autocomplete="email" placeholder="Email" data-placeholder="email" required>
    <div class="captcha">
      <img id="captcha-image" width="220" height="120" alt="">
      <button class="icon-button" id="captcha-new" type="button" aria-label="New picture" data-label="newCaptcha">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 19.7 14h-2.1A6 6 0 1 1 12 6c1.7 0 3.1.7 4.2 1.8L13 11h7V4l-2.3 2.3z"/></svg>
      </button>
    </div>
    <input id="join-answer" type="text" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Characters in the picture" data-placeholder="answer" required>
    <p class="join-error" id="join-error" role="alert" hidden></p>
    <button class="join-submit" id="join-submit" type="submit" data-text="subscribe">Subscribe</button>
  </form>
  <div class="cards">
    <a class="card telegram" href="{{telegram}}" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.8 15.2 9.4 20c.6 0 .8-.3 1.1-.6l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9l3.5-16.6c.3-1.5-.6-2.1-1.6-1.7L1.8 9.9c-1.4.6-1.4 1.4-.2 1.8l5.3 1.6 12.3-7.7c.6-.4 1.1-.2.7.2z"/></svg>
      <span data-text="telegram">Telegram</span>
    </a>
    <button class="card rss" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.2 15.6a2.2 2.2 0 1 1 0 4.4 2.2 2.2 0 0 1 0-4.4zM4 4.4v2.9c7 0 12.7 5.7 12.7 12.7h2.9C19.6 11.4 12.6 4.4 4 4.4zm0 5.7v2.8c3.9 0 7.1 3.2 7.1 7.1h2.8c0-5.5-4.4-9.9-9.9-9.9z"/></svg>
      <span data-text="rss">RSS</span>
    </button>
  </div>
</aside>

<div class="viewer" id="viewer" hidden>
  <div class="viewer-bar">
    <img class="avatar" src="{{channel_avatar}}" alt="">
    <span dir="auto">{{channel_title}}</span>
    <button class="icon-button" id="viewer-close" type="button" aria-label="Close" data-label="close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </button>
  </div>
  <div class="viewer-stage"><img src="{{channel_avatar}}" alt=""></div>
</div>

<div class="menu" id="menu" role="menu" hidden>
  <button type="button" role="menuitem" data-action="text">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
    <span data-text="copyText">Copy Text</span>
  </button>
  <button type="button" role="menuitem" data-action="link">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.9 12A3.1 3.1 0 0 1 7 8.9h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z"/></svg>
    <span data-text="copyLink">Copy Link</span>
  </button>
  <button type="button" role="menuitem" data-action="forward">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5v4C7 10 4 15 3 20c2.5-3.5 6-5.1 11-5.1V19l7-7-7-7z"/></svg>
    <span data-text="forward">Forward</span>
  </button>
  <button type="button" role="menuitem" data-action="flip" id="menu-flip">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12.9 15.1-2.6-2.5c1.8-2 3-4.2 3.8-6.6H17V4h-7V2H8v2H1v2h11.2c-.7 1.9-1.8 3.8-3.2 5.4A15.6 15.6 0 0 1 6.7 8h-2c.7 1.6 1.7 3.2 3 4.6l-5.1 5L4 19l5-5 3.1 3.1.8-2zM18.5 10h-2L12 22h2l1.1-3h4.8l1.1 3h2l-4.5-12zm-2.6 7 1.6-4.3 1.6 4.3h-3.2z"/></svg>
    <span data-text="showEn">Show in English</span>
  </button>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<div class="lightbox" id="lightbox" hidden><img alt=""></div>

<noscript><p class="pill">This channel needs JavaScript to show its posts.</p></noscript>
<script src="/app.js" defer></script>
</body>
</html>
